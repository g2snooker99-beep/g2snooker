<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <title>G2 Staff – เพิ่มแต้ม</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./css/style.css"/>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
  <style>
    .pt-btn{padding:18px 0;border-radius:16px;border:none;background:rgba(45,224,128,0.14);
      color:#48f08d;font-size:22px;font-weight:900;cursor:pointer;transition:background .15s,transform .12s;}
    .pt-btn:active{transform:scale(0.92);}
    .pt-btn:hover{background:rgba(45,224,128,0.28);}
    .pt-btn:disabled{opacity:.4;pointer-events:none;}
    #memberCard{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,0.07);
      border-radius:20px;padding:16px;margin:14px 0;}
    #memberCard .info p{margin:3px 0;font-size:13px;color:#9fe8c0;}
    #successMsg{margin-top:12px;padding:14px;border-radius:16px;background:rgba(45,224,128,0.15);
      color:#b9ffd4;font-weight:700;display:none;font-size:15px;}
    #rewardBox{margin-top:16px;padding:14px;border-radius:18px;background:rgba(255,209,102,0.10);
      border:1px solid rgba(255,209,102,0.35);}
    .reward-item{padding:12px;border-radius:14px;background:rgba(0,0,0,0.22);
      border:1px solid rgba(255,255,255,0.12);}
    .reward-title{font-weight:900;color:#fff;margin-bottom:4px;}
    .reward-meta{color:#9fe8c0;font-size:13px;margin-bottom:4px;}
    .reward-desc{color:#cfcfcf;font-size:13px;margin-bottom:10px;}
    .reward-use-btn{background:#ffd166!important;color:#111!important;font-weight:900!important;}
  </style>
</head>
<body>
<div class="page"><div class="card">
  <h1 style="font-size:20px;text-align:center;">G2 SNOOKER</h1>
  <p class="sub" style="text-align:center;">Staff – เพิ่มแต้มสมาชิก</p>

  <div id="loading" style="text-align:center;padding:30px 0;">กำลังโหลด…</div>
  <div id="accessDenied" class="hidden" style="text-align:center;color:#ff7070;padding:20px;">⛔ คุณไม่มีสิทธิ์เข้าถึงหน้านี้</div>

  <div id="content" class="hidden">
    <div id="searchBox">
      <p style="color:#9fe8c0;font-size:14px;margin:0 0 8px;">ป้อน qrToken หรือรหัสสมาชิก</p>
      <input id="tokenInput" placeholder="วางหรือพิมพ์รหัสที่นี่" style="margin-top:0;"/>
      <button onclick="lookupMember()">🔍 ค้นหาสมาชิก</button>
      <button class="secondary" onclick="window.location.href='./staff-scan.html'" style="margin-top:8px;">📷 สแกน QR แทน</button>
    </div>

    <div id="memberCard" class="hidden">
      <img id="mAvatar" class="avatar" style="width:54px;height:54px;flex-shrink:0;"/>
      <div class="info">
        <b id="mName">–</b>
        <p id="mMemberId">–</p>
        <p id="mCurrentPoints" style="color:#ffd166;font-weight:700;">แต้มเดือนนี้: –</p>
      </div>
    </div>

    <div id="pointButtons" class="hidden">
      <p style="color:#9fe8c0;font-size:14px;margin:4px 0 10px;">เลือกจำนวนแต้มที่จะเพิ่ม</p>
      <div class="point-buttons">
        <button class="pt-btn" onclick="addPoints(1)">+1</button>
        <button class="pt-btn" onclick="addPoints(2)">+2</button>
        <button class="pt-btn" onclick="addPoints(3)">+3</button>
        <button class="pt-btn" onclick="addPoints(5)">+5</button>
        <button class="pt-btn" onclick="addPoints(10)">+10</button>
        <button class="pt-btn" onclick="addPoints(15)">+15</button>
        <button class="pt-btn" onclick="addPoints(20)">+20</button>
        <button class="pt-btn" onclick="addPoints(30)">+30</button>
      </div>

      <div id="successMsg"></div>

      <div id="rewardBox" class="hidden">
        <p style="color:#ffd166;font-size:15px;font-weight:900;margin:0 0 8px;">🎁 สิทธิ์รางวัลของลูกค้า</p>
        <div id="rewardList" style="display:grid;gap:10px;"></div>
      </div>

      <button class="secondary" onclick="resetForm()" style="margin-top:12px;">🔄 เพิ่มให้สมาชิกคนอื่น</button>
    </div>
  </div>
</div></div>

<script src="./js/firebase-config.js"></script>
<script>
  const STAFF_LIFF = "2010084269-Mv2yEosd";
  const cloudFunctions = firebase.app().functions("asia-southeast1");
  const sendPointNotification = cloudFunctions.httpsCallable("sendPointNotification");
  const redeemMonthlyReward = cloudFunctions.httpsCallable("redeemMonthlyReward");

  let staffProfile = null;
  let memberDocId = null;
  let memberData = null;

  async function init() {
    await liff.init({ liffId: STAFF_LIFF });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    staffProfile = await liff.getProfile();

    const staffSnap = await db.collection("users").doc(staffProfile.userId).get();

    if (!staffSnap.exists || !["staff", "admin"].includes(staffSnap.data().role)) {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("accessDenied").classList.remove("hidden");
      return;
    }

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");

    const qrToken = new URLSearchParams(window.location.search).get("qrToken");
    if (qrToken) {
      document.getElementById("tokenInput").value = qrToken;
      await lookupMember();
    }
  }

  async function lookupMember() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) {
      alert("กรุณากรอก qrToken หรือรหัสสมาชิก");
      return;
    }

    let snap = await db.collection("users").where("qrToken", "==", token).limit(1).get();

    if (snap.empty) {
      snap = await db.collection("users").where("memberId", "==", token).limit(1).get();
    }

    if (snap.empty) {
      alert("ไม่พบสมาชิก");
      return;
    }

    const doc = snap.docs[0];
    memberDocId = doc.id;
    memberData = doc.data();

    document.getElementById("mAvatar").src = memberData.pictureUrl || memberData.photoURL || "";
    document.getElementById("mName").textContent = memberData.displayName || memberData.name || "สมาชิก";
    document.getElementById("mMemberId").textContent = "รหัส: " + (memberData.memberId || memberDocId);
    document.getElementById("mCurrentPoints").textContent = "แต้มเดือนนี้: " + (memberData.monthlyPoints || 0);

    document.getElementById("memberCard").classList.remove("hidden");
    document.getElementById("pointButtons").classList.remove("hidden");

    await loadMemberRewards();
  }

  async function addPoints(amount) {
    if (!memberDocId || !memberData) return;

    const buttons = document.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);

    try {
      await db.collection("users").doc(memberDocId).update({
        monthlyPoints: firebase.firestore.FieldValue.increment(amount),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await db.collection("pointTransactions").add({
        userId: memberDocId,
        staffId: staffProfile.userId,
        points: amount,
        type: "add",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      try {
        await sendPointNotification({
          userId: memberDocId,
          points: amount,
          staffId: staffProfile.userId
        });
      } catch (e) {
        console.warn("sendPointNotification failed", e);
      }

      memberData.monthlyPoints = (memberData.monthlyPoints || 0) + amount;
      document.getElementById("mCurrentPoints").textContent = "แต้มเดือนนี้: " + memberData.monthlyPoints;

      const msg = document.getElementById("successMsg");
      msg.style.display = "block";
      msg.textContent = "✅ เพิ่ม +" + amount + " แต้มสำเร็จ!  รวม " + memberData.monthlyPoints + " แต้ม";
    } catch (e) {
      alert("เพิ่มแต้มไม่สำเร็จ: " + (e.message || e));
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }

  async function loadMemberRewards() {
    const rewardBox = document.getElementById("rewardBox");
    const rewardList = document.getElementById("rewardList");

    rewardBox.classList.add("hidden");
    rewardList.innerHTML = "";

    if (!memberDocId) return;

    try {
      const snap = await db.collection("monthlyRewards")
        .where("userId", "==", memberDocId)
        .where("status", "==", "active")
        .get();

      if (snap.empty) {
        rewardList.innerHTML = '<p style="margin:0;color:#9fe8c0;font-size:13px;">ไม่มีสิทธิ์ที่ใช้งานได้</p>';
        rewardBox.classList.remove("hidden");
        return;
      }

      snap.forEach(doc => {
        const r = doc.data() || {};
        const isShirt = r.rewardType === "ranking_shirt";
        const title = isShirt ? (r.title || "เสื้อ Ranking") : (r.title || "ส่วนลดค่าชั่วโมง 10%");
        const desc = r.description || (isShirt ? "รับเสื้อ Ranking ที่ร้าน" : "ใช้ได้ 1 บิล");
        const rankText = r.rank ? "Top " + r.rank + " • " : "";

        const div = document.createElement("div");
        div.className = "reward-item";
        div.innerHTML = `
          <div class="reward-title">${rankText}${title}</div>
          <div class="reward-meta">เดือน ${r.monthKey || "-"} • ${r.points || 0} แต้ม</div>
          <div class="reward-desc">${desc}</div>
          <button class="reward-use-btn" onclick="useMonthlyReward('${doc.id}')">✅ ใช้สิทธิ์นี้</button>
        `;
        rewardList.appendChild(div);
      });

      rewardBox.classList.remove("hidden");
    } catch (e) {
      rewardList.innerHTML = '<p style="margin:0;color:#ff7070;font-size:13px;">โหลดสิทธิ์ไม่ได้: ' + (e.message || e) + '</p>';
      rewardBox.classList.remove("hidden");
    }
  }

  async function useMonthlyReward(rewardId) {
    if (!confirm("ยืนยันใช้สิทธิ์นี้? หลังใช้แล้วจะใช้ซ้ำไม่ได้")) return;

    const buttons = document.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);

    try {
      await redeemMonthlyReward({ rewardId });
      alert("✅ ใช้สิทธิ์สำเร็จ");
      await loadMemberRewards();
    } catch (e) {
      alert("❌ ใช้สิทธิ์ไม่สำเร็จ: " + (e.message || e));
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }

  function resetForm() {
    memberDocId = null;
    memberData = null;

    document.getElementById("tokenInput").value = "";
    document.getElementById("memberCard").classList.add("hidden");
    document.getElementById("pointButtons").classList.add("hidden");
    document.getElementById("rewardBox").classList.add("hidden");
    document.getElementById("rewardList").innerHTML = "";
    document.getElementById("successMsg").style.display = "none";
  }

  init().catch(e => {
    document.getElementById("loading").textContent = "เกิดข้อผิดพลาด: " + (e.message || e);
  });
</script>
</body>
</html>
