<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <title>G2 Member QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <link rel="stylesheet" href="./css/style.css"/>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    .qr-wrap{text-align:center;margin-top:16px;}
    #qrImage{background:#fff;padding:14px;border-radius:18px;margin-top:12px;max-width:260px;width:100%;box-sizing:border-box;}
    .member-box{background:rgba(255,255,255,0.07);border-radius:18px;padding:14px;margin-top:12px;text-align:center;}
    .member-box img{width:72px;height:72px;border-radius:50%;border:4px solid #2de080;object-fit:cover;}
    .token{font-size:12px;color:#9fe8c0;word-break:break-all;margin-top:10px;}
  </style>
</head>
<body>
<div class="page">
  <div class="card">
    <h1 style="font-size:22px;text-align:center;">G2 SNOOKER</h1>
    <p class="sub" style="text-align:center;">QR Code สมาชิก</p>

    <div id="loading" style="text-align:center;padding:30px 0;">กำลังโหลด QR…</div>

    <div id="content" class="hidden">
      <div class="member-box">
        <img id="avatar" src="" alt="profile"/>
        <h2 id="name" style="margin:10px 0 4px;">–</h2>
        <p id="memberId" style="color:#9fe8c0;margin:0;">–</p>
        <p id="points" style="color:#ffd166;font-weight:900;margin:8px 0 0;">แต้มเดือนนี้: –</p>
      </div>

      <div class="qr-wrap">
        <img id="qrImage" alt="QR Code" style="background:#fff;padding:14px;border-radius:18px;margin-top:12px;max-width:260px;width:100%;"/>
        <p class="token" id="qrText"></p>
      </div>

      <button onclick="window.location.href='./member.html'" style="margin-top:18px;">⬅️ กลับหน้าสมาชิก</button>
    </div>

    <div id="error" class="hidden" style="text-align:center;color:#ff7070;padding:20px;"></div>
  </div>
</div>

<script src="./js/firebase-config.js"></script>
<script>
  const MEMBER_LIFF = "2010084269-aui1GaWz";

  function makeQrToken() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return "qr_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  }

  async function init() {
    await liff.init({ liffId: MEMBER_LIFF });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    const userRef = db.collection("users").doc(profile.userId);
    const snap = await userRef.get();

    if (!snap.exists) {
      window.location.href = "./index.html";
      return;
    }

    const user = snap.data() || {};
    let qrToken = user.qrToken;

    if (!qrToken) {
      qrToken = makeQrToken();
      await userRef.update({
        qrToken,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    const staffUrl = "https://member-3e17e.web.app/staff-add-points.html?qrToken=" + encodeURIComponent(qrToken);

    document.getElementById("avatar").src = user.pictureUrl || user.photoURL || profile.pictureUrl || "";
    document.getElementById("name").textContent = user.displayName || user.name || profile.displayName || "สมาชิก";
    document.getElementById("memberId").textContent = "รหัส: " + (user.memberId || profile.userId);
    document.getElementById("points").textContent = "แต้มเดือนนี้: " + (user.monthlyPoints || 0);
    document.getElementById("qrText").textContent = qrToken;

    document.getElementById("qrImage").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(staffUrl);

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
  }

  init().catch(e => {
    document.getElementById("loading").classList.add("hidden");
    const err = document.getElementById("error");
    err.textContent = "เกิดข้อผิดพลาด: " + (e.message || e);
    err.classList.remove("hidden");
  });
</script>
</body>
</html>
